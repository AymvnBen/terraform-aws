<!DOCTYPE html>
<html lang="fr">
  <head>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 60px 80px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 2rem;
        color: #1a1a2e;
        margin-bottom: 20px;
      }

      p {
        font-size: 1.1rem;
        color: #333;
        margin-bottom: 10px;
      }

      .badge {
        display: inline-block;
        margin-top: 30px;
        padding: 8px 20px;
        border-radius: 50px;
        background: #e94560;
        color: white;
        font-size: 0.9rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bienvenue sur le serveur de Younes - Ayman - Lucas !</h1>
      <p>Deploye avec Terraform et Ansible.</p>

</html>
